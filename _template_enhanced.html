<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Selenium - Worksheet</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00e676;
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --text-light: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #1a1a1a;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 50px);
        }

        /* LEFT PANE: Questions */
        .pane-questions {
            width: 40%;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .pane-header {
            padding: 15px;
            background: #252525;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: #fff;
        }

        .questions-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .question-card {
            background: #2d2d2d;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .q-title {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .q-text {
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* RIGHT PANE: App & Solutions */
        .pane-practice {
            width: 60%;
            display: flex;
            flex-direction: column;
            background-color: #f0f0f0;
        }

        .browser-bar {
            background: #e0e0e0;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
        }

        .url-box {
            background: #fff;
            padding: 5px 12px;
            border-radius: 12px;
            flex: 1;
            font-family: monospace;
            font-size: 0.85rem;
            color: #555;
            border: 1px solid #ccc;
        }

        .app-view {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            color: #333;
        }

        .mock-app {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            margin: 0 auto;
            border: 1px solid #ddd;
        }

        .solutions-panel {
            background: #1a1a1a;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sol-header {
            padding: 10px 20px;
            background: #252525;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #aaa;
        }

        .sol-header:hover {
            color: #fff;
            background: #333;
        }

        .sol-content {
            padding: 15px;
            display: none;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            color: #dcdcaa;
            background: #111;
            height: 200px;
            overflow-y: auto;
        }

        .sol-content.visible {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h1><i class="fas fa-terminal"></i> Worksheet: Template</h1>
        <a href="#" onclick="window.close()" style="color:#888; text-decoration:none;">Close</a>
    </header>
    <div class="workspace">
        <div class="pane-questions">
            <div class="pane-header"><i class="fas fa-tasks"></i> Assignments</div>
            <div class="questions-list">
                <div class="question-card">
                    <div class="q-title">Task 1: Inspect Element</div>
                    <div class="q-text">Right-click the form to Inspect.</div>
                </div>
            </div>
        </div>
        <div class="pane-practice">
            <div class="browser-bar">
                <i class="fas fa-globe" style="color:#666"></i>
                <div class="url-box">https://mock-app.test</div>
            </div>
            <div class="app-view">
                <div class="mock-app">
                    <h2>Login</h2>
                    <input type="text" placeholder="Username">
                </div>
            </div>
            <div class="solutions-panel">
                <div class="sol-header" onclick="toggleSolutions()">
                    <span><i class="fas fa-code"></i> Solutions</span>
                    <i class="fas fa-chevron-up" id="sol-icon"></i>
                </div>
                <div class="sol-content" id="sol-body">
                    // Solution Code
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleSolutions() {
            const body = document.getElementById('sol-body');
            const icon = document.getElementById('sol-icon');
            body.classList.toggle('visible');
            icon.className = body.classList.contains('visible') ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
        }
    </script>
</body>

</html>

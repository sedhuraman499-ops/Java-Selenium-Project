<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Worksheet - {{TOPIC_NAME}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .worksheet-container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .split-container {
            display: grid;
            grid-template-columns: 45% 55%;
            min-height: 600px;
        }

        .questions-panel {
            background-color: #f8f9fa;
            padding: 40px;
            border-right: 3px solid #00e676;
            overflow-y: auto;
        }

        .code-panel {
            background-color: #1e1e1e;
            padding: 40px;
            overflow-y: auto;
        }

        .questions-panel h2 {
            color: #00e676;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #00e676;
        }

        .question-item {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-left: 4px solid #00e676;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .question-item h3 {
            color: #2c3e50;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .question-item p {
            color: #555;
            line-height: 1.6;
        }

        .question-item ol,
        .question-item ul {
            margin-left: 20px;
            margin-top: 10px;
            color: #555;
        }

        .question-item li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .code-panel h2 {
            color: #00e676;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #00e676;
        }

        .code-snippet {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid #00e676;
        }

        .code-snippet pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .code-label {
            color: #00e676;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .footer {
            background-color: #2c3e50;
            padding: 20px 40px;
            text-align: center;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background-color: #00e676;
            color: #1e1e1e;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #00c853;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
        }

        .target-url {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .target-url strong {
            color: #856404;
        }

        .target-url a {
            color: #0066cc;
            word-break: break-all;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .split-container {
                grid-template-columns: 1fr;
            }

            .questions-panel {
                border-right: none;
                border-bottom: 3px solid #00e676;
            }
        }

        /* Syntax Highlighting Colors */
        .keyword {
            color: #ff79c6;
        }

        .string {
            color: #f1fa8c;
        }

        .comment {
            color: #6272a4;
            font-style: italic;
        }

        .function {
            color: #50fa7b;
        }

        .variable {
            color: #8be9fd;
        }
    </style>
</head>

<body>

    <div class="worksheet-container">
        <!-- Header -->
        <div class="header">
            <h1>{{TOPIC_TITLE}}</h1>
            <p>Practice Worksheet - Questions & Solutions</p>
        </div>

        <!-- Split View Container -->
        <div class="split-container">
            <!-- Left Panel: Questions -->
            <div class="questions-panel">
                <h2>📝 Practice Questions</h2>

                {{TARGET_URL_SECTION}}

                {{QUESTIONS_CONTENT}}
            </div>

            <!-- Right Panel: Code Solutions -->
            <div class="code-panel">
                <h2>💻 Code Solutions</h2>

                {{CODE_SOLUTIONS}}
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <a href="#" onclick="window.close();" class="btn-back">← Close Worksheet</a>
        </div>
    </div>

</body>

</html>
